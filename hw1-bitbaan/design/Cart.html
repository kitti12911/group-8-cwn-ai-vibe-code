<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บิตบ้าน — ตะกร้าสินค้า</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F4F3EF;color:#141518;font-family:'IBM Plex Sans Thai',system-ui,sans-serif}
a{color:#141518}a:hover{color:#B3101F}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.ph{background:repeating-linear-gradient(135deg,#E7E5DF 0 10px,#EFEDE8 10px 20px)}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-template" id="dc-template">
<div style="min-height: 1350px">
<header style="background: #FFFFFF; border-bottom: 1px solid #D9D7D0">
<div style="max-width: 1280px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px">
<a href="index.html" style="display: flex; align-items: baseline; gap: 10px; text-decoration: none"><span style="font-size: 26px; font-weight: 700">บิตบ้าน</span><span class="mono" style="font-size: 12px; font-weight: 600; color: #B3101F; letter-spacing: 2px">BITBAAN.PC</span></a>
<div style="flex: 1 1 240px"></div>
<a href="Category.html" style="padding: 10px 0; font-size: 15px">เลือกซื้อต่อ</a>
<a href="Account.html" style="text-decoration: none; padding: 10px 12px; font-size: 15px">คุณโอ๊ต · Silver</a>
</div>
</header>

<div style="max-width: 1280px; margin: 0 auto; padding: 40px 24px 64px; display: flex; flex-direction: column; gap: 28px">
<h1 style="margin: 0; font-size: 40px; letter-spacing: -0.5px">ตะกร้า <span class="mono" style="font-size: 22px; color: #5B5D63; font-weight: 500">3 รายการ</span></h1>

<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
<section aria-label="สินค้าในตะกร้า" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #D9D7D0; border-radius: 10px">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
<div style="display: flex; flex-wrap: wrap; gap: 16px 20px; align-items: center; padding: 20px; border-bottom: 1px solid #E7E5DF">
<div class="ph" style="width: 88px; height: 88px; border-radius: 6px; flex: none"></div>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px">
<span class="mono" style="font-size: 12px; color: #5B5D63">{{l.sku}}</span>
<a href="Product.html" style="font-size: 17px; font-weight: 600; text-decoration: none">{{l.name}}</a>
<span style="font-size: 14px; color: #2E6B3A; font-weight: 500">{{l.note}}</span>
</div>
<div style="display: flex; align-items: center; border: 1px solid #C9C6BE; border-radius: 6px">
<button type="button" aria-label="ลดจำนวน {{l.name}}" style="width: 44px; height: 44px; border: 0; background: transparent; font-size: 20px; cursor: pointer">−</button>
<span class="mono" style="width: 32px; text-align: center; font-weight: 600">1</span>
<button type="button" aria-label="เพิ่มจำนวน {{l.name}}" style="width: 44px; height: 44px; border: 0; background: transparent; font-size: 20px; cursor: pointer">+</button>
</div>
<span class="mono" style="width: 120px; text-align: right; font-size: 18px; font-weight: 600">{{l.price}}</span>
<button type="button" aria-label="ลบ {{l.name}}" style="width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B5D63" stroke-width="2" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
</button>
</div>
</sc-for>
</div>

<div style="background: #E9F2EA; border: 1px solid #9CC3A3; border-radius: 8px; padding: 14px 18px; display: flex; gap: 12px; align-items: center; font-size: 15px; color: #1F4A28">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>
<span>ได้ส่วนลดชุดประกอบ ฿500 เพราะมี CPU และเมนบอร์ดในออเดอร์เดียวกัน</span>
</div>

<div style="background: #FFFFFF; border: 1px solid #D9D7D0; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<label for="coupon" style="font-weight: 600; font-size: 16px">โค้ดส่วนลด <span style="font-weight: 400; color: #5B5D63; font-size: 14px">· ใช้ได้ออเดอร์ละ 1 โค้ด</span></label>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<input id="coupon" type="text" value="{{code}}" onChange="{{onCode}}" placeholder="เช่น NEWBIT200" class="mono" style="flex: 1 1 200px; height: 48px; padding: 0 14px; border: 1px solid #C9C6BE; border-radius: 6px; font-size: 16px; text-transform: uppercase">
<button type="button" onClick="{{apply}}" style="height: 48px; padding: 0 22px; border: 0; border-radius: 6px; background: #141518; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">ใช้โค้ด</button>
</div>
<sc-if value="{{ok}}" hint-placeholder-val="{{true}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 15px; background: #F4F3EF; border-radius: 6px; padding: 10px 14px">
<span><span class="mono" style="font-weight: 600">GAMER5</span> ลด 5% เฉพาะการ์ดจอและจอ (สูงสุด ฿1,000) · ใช้กับ จอ 27" 165Hz</span>
<button type="button" onClick="{{remove}}" style="min-height: 44px; border: 0; background: transparent; font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer">เอาออก</button>
</div>
</sc-if>
<sc-if value="{{err}}" hint-placeholder-val="{{false}}">
<p role="alert" style="margin: 0; font-size: 15px; color: #9E0E1C; font-weight: 500">{{err}}</p>
</sc-if>
</div>
</section>

<aside aria-label="สรุปยอด" style="flex: 1 1 360px; max-width: 100%; background: #FFFFFF; border: 1px solid #D9D7D0; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 20px">สรุปยอด</h2>
<div style="display: flex; flex-direction: column; gap: 10px; font-size: 15px">
<div style="display: flex; justify-content: space-between"><span>ราคาสินค้า (รวม VAT)</span><span class="mono">18,870.00</span></div>
<div style="display: flex; justify-content: space-between; color: #2E6B3A"><span>ส่วนลดชุดประกอบ</span><span class="mono">−500.00</span></div>
<div style="display: flex; justify-content: space-between; color: #2E6B3A"><span>สมาชิก Silver 3%</span><span class="mono">−551.10</span></div>
<sc-if value="{{ok}}" hint-placeholder-val="{{true}}"><div style="display: flex; justify-content: space-between; color: #2E6B3A"><span>คูปอง GAMER5</span><span class="mono">−387.52</span></div></sc-if>
<div style="display: flex; justify-content: space-between"><span>ค่าส่ง</span><span>เลือกในขั้นถัดไป</span></div>
</div>
<div style="border-top: 1px solid #141518; padding-top: 14px; display: flex; justify-content: space-between; align-items: baseline">
<span style="font-weight: 600; font-size: 17px">ยอดชำระ</span>
<span class="mono" style="font-size: 30px; font-weight: 600">฿{{total}}</span>
</div>
<div style="background: #F4F3EF; border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #3E4046">
<div style="display: flex; justify-content: space-between"><span>มูลค่าก่อน VAT</span><span class="mono">{{net}}</span></div>
<div style="display: flex; justify-content: space-between"><span>VAT 7%</span><span class="mono">{{vat}}</span></div>
</div>
<p style="margin: 0; font-size: 13px; color: #5B5D63; line-height: 1.6">คิดส่วนลดตามลำดับ ชุดประกอบ → สมาชิก → คูปอง ทุกยอดแสดงถึงสตางค์ และตรงกับใบกำกับภาษี</p>
<a href="Checkout.html" style="display: flex; justify-content: center; align-items: center; min-height: 54px; background: #B3101F; color: #FFFFFF; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 17px">สั่งซื้อและกันของ 30 นาที</a>
<span style="font-size: 13px; color: #5B5D63; text-align: center">ใส่ตะกร้ายังไม่กันของ · กันเมื่อกดสั่งซื้อ</span>
</aside>
</div>
</div>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1350}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { code: 'GAMER5', applied: true, err: '' }; }
renderVals() {
const s = this.state;
const tryCode = () => {
const c = (s.code || '').trim().toUpperCase();
if (c === 'GAMER5') return this.setState({ applied: true, err: '' });
if (c === 'OLD2025') return this.setState({ applied: false, err: 'โค้ด OLD2025 หมดอายุแล้วเมื่อ 31 ธ.ค. 2025' });
if (c === 'NEWBIT200') return this.setState({ applied: false, err: 'NEWBIT200 ใช้ได้กับออเดอร์แรกของบัญชีเท่านั้น' });
this.setState({ applied: false, err: 'ไม่พบโค้ดนี้' });
};
return {
lines: [
{sku:'CPU-N5',name:'CPU Nexa 5 (6 คอร์)',price:'6,290.00',note:'อยู่ในชุดประกอบ'},
{sku:'MB-B6',name:'เมนบอร์ด B6-Lite',price:'4,590.00',note:'อยู่ในชุดประกอบ · ป้ายแดง'},
{sku:'MON-27',name:'จอ 27" 165Hz',price:'7,990.00',note:'ใช้คูปอง GAMER5 ได้'}
],
code: s.code, ok: s.applied, err: s.err,
total: s.applied ? '17,431.38' : '17,818.90',
net: s.applied ? '16,291.01' : '16,653.18',
vat: s.applied ? '1,140.37' : '1,165.72',
onCode: (e) => this.setState({ code: e.target.value }),
apply: tryCode,
remove: () => this.setState({ applied: false, code: '', err: '' })
};
}
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
