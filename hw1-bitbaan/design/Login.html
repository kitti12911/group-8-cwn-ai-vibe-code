<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บิตบ้าน — เข้าสู่ระบบ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F4F3EF;color:#141518;font-family:'IBM Plex Sans Thai',system-ui,sans-serif}
a{color:#141518}a:hover{color:#B3101F}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-template" id="dc-template">
<div style="min-height: 1000px">
<header style="background: #FFFFFF; border-bottom: 1px solid #D9D7D0">
<div style="max-width: 1280px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center">
<a href="index.html" style="display: flex; align-items: baseline; gap: 10px; text-decoration: none"><span style="font-size: 26px; font-weight: 700">บิตบ้าน</span><span class="mono" style="font-size: 12px; font-weight: 600; color: #B3101F; letter-spacing: 2px">BITBAAN.PC</span></a>
</div>
</header>
<div style="max-width: 1080px; margin: 0 auto; padding: 48px 24px 64px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 32px; align-items: start">
<section style="background: #FFFFFF; border: 1px solid #D9D7D0; border-radius: 10px; padding: 32px; display: flex; flex-direction: column; gap: 20px">
<div role="tablist" aria-label="ประเภทบัญชี" style="display: flex; gap: 4px; background: #F4F3EF; border-radius: 8px; padding: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.name}}</button>
</sc-for>
</div>
<h1 style="margin: 0; font-size: 28px">{{heading}}</h1>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="em" style="font-size: 15px; font-weight: 500">อีเมล</label>
<input id="em" type="email" placeholder="you@example.com" style="height: 48px; padding: 0 14px; border: 1px solid #C9C6BE; border-radius: 6px; font: inherit; font-size: 16px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pw" style="font-size: 15px; font-weight: 500">รหัสผ่าน</label>
<input id="pw" type="password" style="height: 48px; padding: 0 14px; border: 1px solid #C9C6BE; border-radius: 6px; font: inherit; font-size: 16px">
</div>
<sc-if value="{{biz}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="co" style="font-size: 15px; font-weight: 500">ชื่อบริษัท</label>
<input id="co" type="text" style="height: 48px; padding: 0 14px; border: 1px solid #C9C6BE; border-radius: 6px; font: inherit; font-size: 16px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="tax" style="font-size: 15px; font-weight: 500">เลขประจำตัวผู้เสียภาษี (13 หลัก)</label>
<input id="tax" type="text" inputmode="numeric" class="mono" placeholder="0-0000-00000-00-0" style="height: 48px; padding: 0 14px; border: 1px solid #C9C6BE; border-radius: 6px; font-size: 16px">
</div>
<p style="margin: 0; font-size: 14px; color: #3E4046; background: #F4F3EF; border-radius: 6px; padding: 12px 14px; line-height: 1.6">สมัครแล้วได้ส่วนลด Business 8% ทันที ไม่ต้องดูยอดสะสม · ขอใบเสนอราคาและใบกำกับภาษีเต็มรูปได้</p>
</div>
</sc-if>
<a href="Account.html" style="display: flex; justify-content: center; align-items: center; min-height: 52px; background: #141518; color: #FFFFFF; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 17px">{{cta}}</a>
<sc-if value="{{isLogin}}" hint-placeholder-val="{{true}}"><a href="Login.html" style="align-self: center; font-size: 15px; padding: 10px 0">ลืมรหัสผ่าน</a></sc-if>
</section>

<aside style="display: flex; flex-direction: column; gap: 20px">
<div style="background: #FFFFFF; border: 1px solid #D9D7D0; border-radius: 10px; padding: 28px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 22px">สั่งซื้อโดยไม่สมัครสมาชิก</h2>
<p style="margin: 0; font-size: 15px; color: #3E4046; line-height: 1.6">ใช้แค่อีเมลและเบอร์โทรเพื่อรับสถานะออเดอร์ ไม่ได้ส่วนลดสมาชิกและไม่นับยอดสะสม</p>
<a href="Checkout.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border: 1.5px solid #141518; border-radius: 6px; text-decoration: none; font-weight: 600">สั่งซื้อแบบ Guest</a>
</div>
<div style="padding: 4px 4px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px">ทำไมต้องสมัคร</h2>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; color: #3E4046; line-height: 1.6">
<li>ยอดซื้อสะสม 12 เดือนครบ ฿20,000 เป็น Silver ลด 3% ครบ ฿100,000 เป็น Gold ลด 5%</li>
<li>ออเดอร์แรกใช้โค้ด <span class="mono" style="color: #141518; font-weight: 600">NEWBIT200</span> ลด ฿200 เมื่อซื้อครบ ฿2,000</li>
<li>ติดตามออเดอร์ ขอคืนของ และดูใบกำกับภาษีย้อนหลังได้เอง</li>
</ul>
</div>
</aside>
</div>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { tab: 'login' }; }
renderVals() {
const s = this.state;
const list = [['login','เข้าสู่ระบบ'],['reg','สมัครสมาชิก'],['biz','บัญชีบริษัท']];
const head = { login: 'ยินดีต้อนรับกลับ', reg: 'สร้างบัญชีใหม่', biz: 'สมัครสมาชิก Business' };
const cta = { login: 'เข้าสู่ระบบ', reg: 'สมัครสมาชิก', biz: 'สมัคร Business' };
return {
tabs: list.map(t => ({ name: t[1], on: s.tab === t[0], pick: () => this.setState({ tab: t[0] }),
style: 'flex:1;min-height:44px;border:0;border-radius:6px;font:inherit;font-size:15px;cursor:pointer;' + (s.tab === t[0] ? 'background:#FFFFFF;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)' : 'background:transparent;color:#3E4046') })),
heading: head[s.tab], cta: cta[s.tab], biz: s.tab === 'biz', isLogin: s.tab === 'login'
};
}
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
