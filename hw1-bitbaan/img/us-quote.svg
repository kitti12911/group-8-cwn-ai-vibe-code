<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Sukhumvit Set, Tahoma, 'Noto Sans Thai', sans-serif">
  <rect width="1100" height="560" fill="#eef1f5"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1f2a37">US-40 / US-41 · คุณจอยขอใบเสนอราคา 10 จอ แล้วได้ใบกำกับภาษีที่ตรงทุกสตางค์</text>
  <text x="24" y="56" font-size="13" fill="#5b6470">ตัวเลขใช้สมมติฐานของทีม: Business ใช้คูปองได้ (K8) · GAMER5 เพดาน ฿1,000 ต่อออเดอร์ (Q4) · ใบเสนอราคายืนราคาถึงสิ้นวันที่ 7 (Q17)</text>

  <g transform="translate(24,76)">
    <rect width="620" height="464" rx="6" fill="#fff" stroke="#c7ced8"/>
    <rect width="620" height="6" fill="#b45309"/>
    <text x="24" y="44" font-size="20" font-weight="800">ใบเสนอราคา Q-261113-0001</text>
    <text x="596" y="44" font-size="13" text-anchor="end" fill="#6b7280">บิตบ้าน คอมพิวเตอร์</text>
    <text x="24" y="72" font-size="13">ลูกค้า: บริษัท ดีไซน์โค (C5) · Business 8%</text>
    <text x="24" y="92" font-size="13">ออก: ศุกร์ 13 พ.ย. 2026 10:00</text>
    <rect x="300" y="78" width="296" height="24" rx="12" fill="#fef3c7"/><text x="448" y="95" font-size="13" text-anchor="middle" fill="#92400e" font-weight="700">ยืนราคาถึง ศุกร์ 20 พ.ย. 2026 23:59:59</text>
    <line x1="24" y1="118" x2="596" y2="118" stroke="#e5e7eb"/>
    <g font-size="14">
      <text x="24" y="146">MON-27 จอ 27" 165Hz</text><text x="370" y="146">10 × 7,990</text><text x="596" y="146" text-anchor="end">79,900.00</text>
      <text x="24" y="178" fill="#0f766e">ส่วนลดสมาชิก Business 8%</text><text x="596" y="178" text-anchor="end" fill="#0f766e">−6,392.00</text>
      <text x="24" y="210" fill="#7c3aed">คูปอง GAMER5 (5% = 3,995 → เพดาน)</text><text x="596" y="210" text-anchor="end" fill="#7c3aed">−1,000.00</text>
      <text x="24" y="242">ค่าส่งปกติ (ครบ ฿3,000)</text><text x="596" y="242" text-anchor="end">0.00</text>
      <line x1="24" y1="262" x2="596" y2="262" stroke="#1f2a37"/>
      <text x="24" y="292" font-weight="700">ยอดชำระ (รวม VAT)</text><text x="596" y="292" text-anchor="end" font-weight="800" font-size="18">72,508.00</text>
      <text x="24" y="324" fill="#374151">มูลค่าก่อน VAT</text><text x="596" y="324" text-anchor="end">67,764.49</text>
      <text x="24" y="352" fill="#374151">VAT 7%</text><text x="596" y="352" text-anchor="end">4,743.51</text>
    </g>
    <rect x="24" y="378" width="572" height="64" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="40" y="404" font-size="13" fill="#065f46" font-weight="700">ตรวจ: 67,764.49 + 4,743.51 = 72,508.00 ✓ ตรงกับยอดที่จ่าย</text>
    <text x="40" y="426" font-size="12" fill="#065f46">VAT = 72,508 × 7 ÷ 107 = 4,743.514… → ปัดครึ่งขึ้น 2 ตำแหน่ง = 4,743.51</text>
  </g>

  <g transform="translate(668,76)" font-size="14">
    <rect width="408" height="464" rx="10" fill="#fff" stroke="#c7ced8"/>
    <text x="20" y="36" font-size="16" font-weight="700">เกณฑ์ยอมรับที่ภาพนี้ตรวจ</text>
    <text x="20" y="70">✓ ราคาในใบเสนอไม่เปลี่ยนจนถึงวันหมดอายุ</text>
    <text x="40" y="92" font-size="12" fill="#6b7280">แม้ระหว่างนั้นร้านเปลี่ยนราคาป้าย</text>
    <text x="20" y="124">✓ 20 พ.ย. 23:59:59 สั่งจากใบเสนอได้</text>
    <text x="20" y="150">✗ 21 พ.ย. 00:00:00 ขึ้น "ใบเสนอราคาหมดอายุ"</text>
    <text x="20" y="182">✓ ก่อน VAT + VAT = ยอดชำระ ทุกสตางค์</text>
    <text x="20" y="208">✓ ใบเสนอราคาไม่กันสต็อก</text>
    <text x="40" y="230" font-size="12" fill="#6b7280">(สต็อก MON-27 มี 5 จอ: สั่ง 10 จอต้องรอของ · Q17)</text>
    <rect x="20" y="262" width="368" height="120" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="36" y="290" font-weight="700" fill="#991b1b">ทำไมยาก</text>
    <text x="36" y="314" font-size="13" fill="#991b1b">ออเดอร์ 5 ชุดของคุณจอย (฿53,682)</text>
    <text x="36" y="336" font-size="13" fill="#991b1b">ทั้งบิล VAT 3,511.91 · ต่อชิ้นแล้วคูณจำนวน 3,511.92</text>
    <text x="36" y="358" font-size="13" fill="#991b1b">ต่าง 1 สตางค์ แบบที่ฝ่ายบัญชีเคยตีกลับ (Q18)</text>
  </g>
</svg>
