<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" font-family="Sukhumvit Set, Tahoma, 'Noto Sans Thai', sans-serif">
  <rect width="1100" height="420" fill="#eef1f5"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1f2a37">US-30 / US-31 · กดสั่งแล้วร้านกันของ 30 นาที · หน้าจ่ายเงินมีนับถอยหลัง</text>
  <text x="24" y="56" font-size="13" fill="#5b6470">ขอบเวลาที่ต้องทดสอบ 3 ค่า: 29:59 · 30:00 · 30:01 (ร้านยังไม่บอกว่า 30:00 พอดียังจ่ายได้ไหม: Q8)</text>

  <!-- phone -->
  <g transform="translate(24,76)">
    <rect width="300" height="330" rx="26" fill="#111827"/><rect x="12" y="14" width="276" height="302" rx="18" fill="#fff"/>
    <text x="150" y="50" font-size="15" font-weight="700" text-anchor="middle">ชำระเงินออเดอร์ #BB-261113-0042</text>
    <rect x="34" y="66" width="232" height="84" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="150" y="92" font-size="13" text-anchor="middle" fill="#991b1b">ร้านกันของให้อีก</text>
    <text x="150" y="134" font-size="38" font-weight="800" text-anchor="middle" fill="#b91c1c">12:47</text>
    <text x="34" y="180" font-size="13">GPU-V57 × 1</text><text x="266" y="180" font-size="13" text-anchor="end">฿23,990</text>
    <text x="34" y="202" font-size="13" fill="#6b7280">กันไว้ถึง 13:12:00</text>
    <rect x="34" y="226" width="232" height="44" rx="10" fill="#1d4ed8"/><text x="150" y="254" font-size="15" text-anchor="middle" fill="#fff">จ่ายด้วย QR</text>
    <text x="150" y="296" font-size="11" text-anchor="middle" fill="#6b7280">หมดเวลาแล้วระบบปล่อยของคืนเอง</text>
  </g>

  <!-- timeline -->
  <g transform="translate(360,110)" font-size="14">
    <text font-size="16" font-weight="700" fill="#1f2a37">เส้นเวลาของ 1 ออเดอร์ (เริ่ม 12:42:00)</text>
    <line x1="10" y1="80" x2="700" y2="80" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
    <line x1="10" y1="80" x2="560" y2="80" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="10" cy="80" r="10" fill="#16a34a"/><text x="10" y="116" text-anchor="middle">00:00</text><text x="0" y="136" font-size="12" fill="#6b7280">กดสั่ง · สต็อกที่ขายได้ 1 → 0</text>
    <circle cx="540" cy="80" r="9" fill="#16a34a"/><text x="530" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">29:59 จ่ายได้</text>
    <circle cx="560" cy="80" r="11" fill="#f59e0b"/><text x="575" y="116" text-anchor="middle" font-weight="700" fill="#b45309">30:00 = ? (Q8)</text>
    <circle cx="580" cy="80" r="9" fill="#dc2626"/><text x="630" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">30:01 จ่ายไม่ได้</text>
    <rect x="300" y="160" width="400" height="110" rx="10" fill="#fff" stroke="#fca5a5"/>
    <text x="316" y="188" font-weight="700" fill="#991b1b">หลังหมดเวลา ระบบต้องทำครบ 3 อย่าง</text>
    <text x="316" y="212">1. ออเดอร์เป็น "หมดเวลา" จ่ายเงินเข้ามาไม่ได้</text>
    <text x="316" y="234">2. สต็อกที่ขายได้คืน 0 → 1 ให้คนอื่นกดได้ทันที</text>
    <text x="316" y="256">3. สิทธิ์ "คนละ 1 ใบ" ของคนนี้ว่างอีกครั้ง</text>
    <text y="190" font-size="13" fill="#374151">คุณมิ้นท์เคยกันถึงร้านปิด (K6)</text>
    <text y="212" font-size="13" fill="#374151">คุณโอ๊ตเคยเห็นนับ 15 นาที</text>
    <text y="234" font-size="13" fill="#374151">คุณเก่งสั่ง 30 นาที ← ใช้อันนี้</text>
  </g>
</svg>
