<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" font-family="Sukhumvit Set, Tahoma, 'Noto Sans Thai', sans-serif">
  <rect width="1100" height="430" fill="#f7f5f0"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1f2a37">US-32 / US-33 · GPU-V57 เหลือ 1 ใบ มีคนกด "สั่งเลย" พร้อมกัน 3 คำขอ</text>
  <text x="24" y="56" font-size="13" fill="#5b6470">เรื่องจริงของร้าน (บ.66): เคยยืนยันใบเดียวให้ 2 คน · ผลที่ถูก: สำเร็จพอดี 1 คำขอ ที่เหลือเห็นข้อความชัด ไม่มีใบยืนยันซ้ำ</text>

  <g font-size="14">
    <!-- lanes -->
    <g transform="translate(24,86)">
      <rect width="190" height="80" rx="10" fill="#d5f2ee"/><text x="16" y="34" font-weight="700">คุณโอ๊ต แท็บ 1</text><text x="16" y="58" font-size="12" fill="#374151">C3 · 10:00:00.120</text>
      <line x1="200" y1="40" x2="560" y2="40" stroke="#0f766e" stroke-width="3" marker-end="url(#g)"/>
      <rect x="580" y="8" width="476" height="64" rx="10" fill="#ecfdf5" stroke="#34d399"/><text x="596" y="36" font-weight="700" fill="#065f46">✓ กันของสำเร็จ 30 นาที · ออเดอร์ #BB-261116-0001</text><text x="596" y="58" font-size="12" fill="#065f46">สต็อกที่ขายได้ 1 → 0 · สิทธิ์ 1 ใบของบัญชีนี้ถูกใช้แล้ว</text>
    </g>
    <g transform="translate(24,186)">
      <rect width="190" height="80" rx="10" fill="#d5f2ee"/><text x="16" y="34" font-weight="700">คุณโอ๊ต แท็บ 2</text><text x="16" y="58" font-size="12" fill="#374151">C3 · 10:00:00.121</text>
      <line x1="200" y1="40" x2="560" y2="40" stroke="#0f766e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#g)"/>
      <rect x="580" y="8" width="476" height="64" rx="10" fill="#fff7ed" stroke="#fb923c"/><text x="596" y="36" font-weight="700" fill="#9a3412">✗ "รุ่นนี้จำกัดคนละ 1 ใบ คุณมีออเดอร์ที่กันไว้แล้ว"</text><text x="596" y="58" font-size="12" fill="#9a3412">ไม่มีออเดอร์ใหม่ · ไม่กระทบสต็อก (US-33)</text>
    </g>
    <g transform="translate(24,286)">
      <rect width="190" height="80" rx="10" fill="#fde4d3"/><text x="16" y="34" font-weight="700">คุณพลอย</text><text x="16" y="58" font-size="12" fill="#374151">C4 · 10:00:00.122</text>
      <line x1="200" y1="40" x2="560" y2="40" stroke="#c2410c" stroke-width="3" marker-end="url(#o)"/>
      <rect x="580" y="8" width="476" height="64" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="596" y="36" font-weight="700" fill="#991b1b">✗ "สินค้าหมดแล้ว" · ปุ่มแจ้งเตือนเมื่อมีของ</text><text x="596" y="58" font-size="12" fill="#991b1b">ไม่ได้รับใบยืนยัน ไม่ได้โอนเงินก่อน (US-32)</text>
    </g>
    <rect x="300" y="384" width="500" height="34" rx="8" fill="#1f2a37"/><text x="550" y="406" text-anchor="middle" fill="#fff" font-size="13">ตรวจหลังยิง: ออเดอร์ GPU-V57 ที่ยังใช้งาน = 1 · สต็อกที่ขายได้ = 0 · ไม่ติดลบ</text>
  </g>
  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
  </defs>
</svg>
