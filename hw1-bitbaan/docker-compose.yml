# บิตบ้าน คอมพิวเตอร์ · 3 containers on one network (DESIGN.md section 1)
#   docker compose up -d --build          → http://localhost:3000
#   BUG_MODE=1 docker compose up -d       → run the plan against the planted bugs
name: bitbaan

services:
  db:
    image: postgres:16-alpine
    container_name: bitbaan-db
    environment:
      POSTGRES_USER: bitbaan
      POSTGRES_PASSWORD: bitbaan
      POSTGRES_DB: bitbaan
      TZ: Asia/Bangkok
    ports:
      - "5434:5432"          # from our machine only; backend uses db:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitbaan -d bitbaan"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [bitbaan-net]

  backend:
    build: ./backend
    container_name: bitbaan-backend
    environment:
      DATABASE_URL: postgres://bitbaan:bitbaan@db:5432/bitbaan?sslmode=disable
      TEST_MODE: "1"
      BUG_MODE: "${BUG_MODE:-0}"
      RESET_ON_START: "1"    # every start = clean TEST-DATA.md seed, clock 2026-11-13 10:00
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    networks: [bitbaan-net]

  frontend:
    build: ./frontend
    container_name: bitbaan-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [bitbaan-net]

networks:
  bitbaan-net:
    name: bitbaan-net

volumes:
  db-data:
